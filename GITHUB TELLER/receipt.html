<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 40px;
      box-sizing: border-box;
    }

    img {
      max-width: 100%;
      max-height: 100vh;
      display: block;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <img src="IKWEBE_Solomon_Main_2.jpg" alt="Image" />
</body>
</html>
